# Fronts php-fpm in compose.yml. Static files come from the same image, mounted read-only.
server {
  listen 80;
  server_name _;
  root /app/public;
  index index.php;

  client_max_body_size 32m;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
    fastcgi_read_timeout 300;
  }

  location /build/ {
    expires 30d;
    access_log off;
  }

  location ~ /\. { deny all; }
}
