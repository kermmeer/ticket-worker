# Ticket Worker on any machine with Docker: see INSTALL.md.
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d --build
#
# Everything the app keeps lives in the database volume and in ./data: the systems you
# push into (data/systems), the agents' workspaces and Claude Code's sessions (data/agent).
# Settings come from .env; the lines under `environment` are the ones this setup decides.
name: ticket-worker

# The queue containers start once the app has migrated the database.
x-migrated: &migrated
  app:
    condition: service_healthy

x-app: &app
  image: ticket-worker:app
  build: &build
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  restart: unless-stopped
  env_file: .env
  environment: &env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr
    AGENT_WORKSPACES_PATH: /data/agent/tickets
    SYSTEMS_PATH: /data/systems
    CLAUDE_CONFIG_DIR: /data/agent/claude
  volumes:
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticket_worker}
      MYSQL_USER: ${DB_USERNAME:-ticket_worker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # php-fpm. On start it migrates the database; healthy means that is done.
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "test", "-f", "/app/storage/framework/migrated"]
      interval: 3s
      timeout: 3s
      retries: 100

  web:
    image: ticket-worker:web
    build:
      <<: *build
      target: web
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on: *migrated

  # Every job except agent turns: Jira sync, preparing the systems' folders.
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on: *migrated

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on: *migrated

  # Agent turns only, with Claude Code. It reads the systems, never writes them.
  agent:
    <<: *app
    image: ticket-worker:agent
    build:
      <<: *build
      target: agent
    deploy:
      replicas: ${AGENT_MAX_PARALLEL:-2}
    command: ["php", "artisan", "queue:work", "--queue=agents", "--sleep=3", "--tries=1", "--timeout=1800"]
    stop_grace_period: 60s
    depends_on: *migrated
    environment:
      <<: *env
      HOME: /data/agent/home
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ./data/agent:/data/agent
      - ./data/systems:/data/systems:ro

volumes:
  db:
